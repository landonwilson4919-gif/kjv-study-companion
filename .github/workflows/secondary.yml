#!/usr/bin/env python3
"""
bible_db_builder.py

Builds a structured SQLite database from Bible, Strong's, Webster's 1828,
and Matthew Henry commentary source files (JSON or text).

Usage:
    python bible_db_builder.py \
        --bible path/to/bible.json \
        --strongs path/to/strongs.json \
        --webster path/to/webster.json \
        --mhenry path/to/mhenry/   \
        --output bible.db

You will almost certainly need to adjust the four parser functions
(parse_bible, parse_strongs, parse_webster, parse_mhenry) to match
the exact shape of the files you already have.
"""

import argparse
import json
import os
import re
import sqlite3
from pathlib import Path
from typing import Any, Dict, List, Optional, Tuple


